[project]
name = "aieos-dark-factory"
version = "0.1.0"
description = "AIEOS autonomous pipeline conductor (dark factory) — walks the kit DAG lights-out, parks at human freeze gates."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
dark-factory = "src.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
