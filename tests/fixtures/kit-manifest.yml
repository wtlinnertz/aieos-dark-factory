# SYNCHRONIZED FILES
# ═════════════════════════════════════════════════════════════════════════════
# Files that must be byte-identical across multiple repos.
# canonical: the authoritative source
# copies: locations that must match

synchronized_files:
  - name: "governance-model.md"
    canonical: "aieos-governance-foundation/governance-model.md"
    copies:
      - "aieos-strategic-direction-kit/docs/governance-model.md"
      - "aieos-product-intelligence-kit/docs/governance-model.md"
      - "aieos-solution-sourcing-kit/docs/governance-model.md"
      - "aieos-engineering-execution/docs/governance-model.md"
      - "aieos-release-exposure-kit/docs/governance-model.md"
      - "aieos-reliability-resilience-kit/docs/governance-model.md"
      - "aieos-insight-evolution-kit/docs/governance-model.md"
      - "aieos-operational-diagnostics-kit/docs/governance-model.md"
      - "aieos-quality-assurance-kit/docs/governance-model.md"
      - "aieos-security-compliance-kit/docs/governance-model.md"
      - "aieos-data-configuration-kit/docs/governance-model.md"
      - "aieos-platform-infrastructure-kit/docs/governance-model.md"
      - "aieos-documentation-knowledge-kit/docs/governance-model.md"
      - "aieos-peer-review-kit/docs/governance-model.md"
      - "aieos-business-process-kit/docs/governance-model.md"


# ═════════════════════════════════════════════════════════════════════════════
# INITIATIVE PRESETS
# ═════════════════════════════════════════════════════════════════════════════
# Golden paths for common initiative types.

presets:
  - name: "New Feature"
    entry_point: "PIK:WCR"
    required_kits: [PIK, EEK, QAK, SCK, DCK, PINFK, DKK, REK, RRK, IEK]
    optional_kits: [SDK, ODK, SSK, PRK, BPK]

  - name: "Enhancement"
    entry_point: "EEK:KER"
    required_kits: [EEK, REK]
    optional_kits: [SDK, PIK, QAK, SCK, DCK, DKK, RRK, IEK, PRK, BPK]

  - name: "Compliance and Regulatory"
    entry_point: "PIK:WCR"
    required_kits: [PIK, EEK, SCK, QAK, REK, RRK]
    optional_kits: [SDK, IEK, ODK, SSK, PRK, BPK]

  - name: "Performance and Reliability Fix"
    entry_point: "ODK:DCR"
    required_kits: [ODK, EEK, REK, RRK]
    optional_kits: [QAK, SCK, DKK, PRK]

  - name: "Exploratory Research"
    entry_point: "PIK:WCR"
    required_kits: [PIK]
    optional_kits: []
