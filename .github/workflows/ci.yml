name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # windows-latest added with the G-6-class sweep (2026-08-16): the first
    # Windows run of this suite found load_manifest crashing on cp1252 --
    # the same defect class the harness fixed in v1.3.1. The matrix is the
    # enforcement.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov ruff
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q --cov=src --cov-report=term-missing
